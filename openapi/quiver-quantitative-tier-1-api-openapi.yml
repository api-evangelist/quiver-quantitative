openapi: 3.2.0
info:
  title: Quiver Tier 1 API
  version: v1
  description: Tap into the power of alternative data
  contact:
    name: 'Us: info@quiverquant.com'
    email: info@quiverquant.com
  license:
    name: Terms of Service
    url: https://www.quiverquant.com/termsofservice/
servers:
- url: https://api.quiverquant.com
tags:
- name: Tier 1
  description: tier 1 endpoint
paths:
  /beta/auth/premium:
    get:
      operationId: auth_premium_retrieve
      description: Premium Auth View
      summary: Premium Authentication
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumAuthResponse'
          description: ''
      x-internal: true
  /beta/bulk/congress/politicians:
    get:
      operationId: bulk_congress_politicians_retrieve
      description: Returns a paginated list of all congress members and FEC-registered candidates with trading stats and net worth. Includes both seated members and candidates by default. Results can be sorted by name, trade count, trade volume, or net worth.
      summary: Bulk Congress Politicians
      parameters:
      - in: query
        name: chamber
        schema:
          type: string
        description: 'Filter by congressional chamber: house or senate (case-insensitive)'
      - in: query
        name: include_candidates
        schema:
          type: boolean
          default: 'True'
        description: Include FEC-registered candidates who are not current congress members. Defaults to true. Set to false to return only seated members.
      - in: query
        name: is_active
        schema:
          type: boolean
          default: 'True'
        description: Filter by active/inactive status. Defaults to true for the live endpoint (only active members). Set to false to include all members.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items / page
      - in: query
        name: party
        schema:
          type: string
        description: 'Filter by party affiliation: Democratic, Republican, or Independent'
      - in: query
        name: sort_by
        schema:
          type: string
          default: name
        description: 'Sort field for results. Accepted values: name (alphabetical, ascending), trade_count (descending), trade_volume (descending), net_worth (descending).'
      - in: query
        name: state
        schema:
          type: string
        description: Filter by US state (full name, e.g. California, Texas, New York)
      - in: query
        name: volume_method
        schema:
          type: string
          default: average
        description: 'Method to estimate trade volume from disclosed amount ranges (e.g. ''$1,001 - $15,000''). Accepted values: range_start (lower bound), average (midpoint, default), range_end (upper bound).'
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCongressPoliticiansResponse'
          description: ''
  /beta/bulk/congresstrading:
    get:
      operationId: bulk_congresstrading_retrieve
      description: Returns the full history of transactions by members of U.S. Congress.
      summary: Bulk Congress Trading
      parameters:
      - in: query
        name: bioguide_id
        schema:
          type: string
        description: Congressperson's BioGuide id
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Date, formatted as YYYYMMDD
      - in: query
        name: nonstock
        schema:
          type: boolean
        description: Include non-stock transactions
      - in: query
        name: normalized
        schema:
          type: boolean
        description: Normalize representative/senator names
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items / page
      - in: query
        name: representative
        schema:
          type: string
        description: Congressperson's name
      - in: query
        name: ticker
        schema:
          type: string
        description: Ticker for any given stock
      - in: query
        name: version
        schema:
          type: string
          default: V1
        description: API Version, one of V1 or V2
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllCongressViewResponse'
          description: ''
  /beta/bulk/corporatedonors:
    get:
      operationId: bulk_corporatedonors_retrieve
      description: Returns a paginated bulk of all PAC donations to politicians. Filter by ticker, bioguide ID, election cycle, or FEC transaction type code. Ordered by most recent transaction date.
      summary: Bulk Corporate Donors
      parameters:
      - in: query
        name: bioguide_id
        schema:
          type: string
        description: Congressperson's BioGuide id
      - in: query
        name: cycle
        schema:
          type: string
        description: Filter donors by election cycle (e.g., 2024)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items / page
      - in: query
        name: ticker
        schema:
          type: string
        description: Ticker for any given stock
      - in: query
        name: transaction_tp
        schema:
          type: string
        description: Filter by FEC transaction type code (e.g. 24K = contribution to candidate, 24E = independent expenditure). See FEC transaction type codes for full list.
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCorporateDonorsResponse'
          description: ''
  /beta/bulk/trumpstocktrades:
    get:
      operationId: bulk_trumpstocktrades_retrieve
      description: Returns recent stock transactions made by Donald Trump. Default page size is 200.
      summary: Bulk Trump Stock Trades
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items / page
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
