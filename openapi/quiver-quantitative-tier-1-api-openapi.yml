            application/json:
              schema:
                $ref: '#/components/schemas/TrumpStockTradesResponse'
          description: ''
  /beta/coins:
    get:
      operationId: coins_retrieve
      description: Get coins data from reddit.
      summary: Coins
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinsResponse'
          description: ''
      x-internal: true
  /beta/companies:
    get:
