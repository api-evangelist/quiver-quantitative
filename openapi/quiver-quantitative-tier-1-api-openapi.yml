      description: Returns Polymarket trades flagged as large or unusual bets. Sports-market trades are excluded by default.
      summary: Polymarket Top Trades
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Date, formatted as YYYYMMDD
      - in: query
        name: include_sports_markets
