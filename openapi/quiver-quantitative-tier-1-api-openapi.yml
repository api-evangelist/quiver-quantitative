  /beta/historical/corporatedonors/{ticker}:
    get:
      operationId: historical_corporatedonors_retrieve
      description: Returns all PAC (Political Action Committee) donations from a company to politicians, filtered by stock ticker. Includes donor committee name, transaction amount, date, cycle, and transaction type. Paginated with a default of 500 results per page.
      summary: Historical Corporate Donors by Ticker
      parameters:
      - in: query
        name: bioguide_id
        schema:
          type: string
        description: Congressperson's BioGuide id
      - in: query
        name: cycle
        schema:
          type: string
        description: Filter donors by election cycle (e.g., 2024)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items / page
      - in: path
