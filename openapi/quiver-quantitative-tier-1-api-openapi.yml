  /beta/live/congress/politicians:
    get:
      operationId: live_congress_politicians_retrieve
      description: Returns currently active congress members with their trading stats (trade count, estimated trade volume) and live net worth. Defaults to active members only. Use chamber, party, and state filters to narrow results.
      summary: Live Congress Politicians
      parameters:
      - in: query
        name: chamber
        schema:
          type: string
        description: 'Filter by congressional chamber: house or senate (case-insensitive)'
      - in: query
        name: is_active
        schema:
          type: boolean
          default: 'True'
        description: Filter by active/inactive status. Defaults to true for the live endpoint (only active members). Set to false to include all members.
      - in: query
        name: party
        schema:
          type: string
        description: 'Filter by party affiliation: Democratic, Republican, or Independent'
      - in: query
        name: state
        schema:
          type: string
        description: Filter by US state (full name, e.g. California, Texas, New York)
      - in: query
        name: volume_method
        schema:
          type: string
          default: average
        description: 'Method to estimate trade volume from disclosed amount ranges (e.g. ''$1,001 - $15,000''). Accepted values: range_start (lower bound), average (midpoint, default), range_end (upper bound).'
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCongressPoliticiansResponse'
          description: ''
  /beta/live/congress_stock_holdings:
    get:
      operationId: live_congress_stock_holdings_retrieve
      description: Returns estimate of current stock holdings of members of U.S. Congress. Use the bioguide_id, ticker, and sort_by_holding parameters to filter and sort the results.
      summary: Live Congress Stock Holdings
      parameters:
      - in: query
        name: bioguide_id
        schema:
          type: string
        description: Congressperson's BioGuide id
      - in: query
        name: sort_by_holding
        schema:
          type: boolean
          default: 'False'
        description: 'Sort portfolio holdings by current holding amount (descending). Accepted values: true (sort by current holding), false (sort by allocation).'
      - in: query
        name: ticker
        schema:
          type: string
        description: Ticker for any given stock
      tags:
      - Tier 1
      security:
      - WebPlatformTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCongressStockHoldingsResponse'
          description: ''
